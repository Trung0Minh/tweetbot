[project]
name = "discord-x-feed-bot"
version = "0.1.0"
description = "Forward new public X posts into Discord channels."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.21.0",
    "discord.py==2.7.1",
    "python-dotenv==1.2.3",
    "twikit==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["AGENTS.md", "IMPLEMENTATION_PLAN.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
